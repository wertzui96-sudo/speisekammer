<!DOCTYPE html>
<html>
<head>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <meta charset="UTF-8">
  <title>Speisekammer</title>
  <style>
    body { font-family: Arial; margin: 40px; }
    input, button { padding: 8px; margin: 5px; }
    table { margin-top: 20px; width: 100%; border-collapse: collapse; }
    th, td { border: 1px solid #ccc; padding: 10px; text-align: left; }
  </style>
</head>
<body>

<h1>🥫 Meine Speisekammer</h1>

<input id="name" placeholder="Produkt">
<input id="mhd" placeholder="MHD (z.B. 01.01.2026)">
<input id="qty" type="number" placeholder="Menge" value="1" min="1">

<br><br>

<button onclick="startScanner()">📷 Scanner starten</button>
<button onclick="switchCamera()">🔄 Kamera wechseln</button>

<div id="reader" style="width:300px; margin-top:10px;"></div>
  
<button onclick="addProduct()">Einlagern</button>

<table>
  <thead>
    <tr>
      <th>Produkt</th>
      <th>MHD</th>
      <th>Aktion</th>
    </tr>
  </thead>
  <tbody id="list"></tbody>
</table>

<script>
let html5QrCode;
let cameras = [];
let currentCameraIndex = 0;

function startScanner() {
  const reader = document.getElementById("reader");

  html5QrCode = new Html5Qrcode("reader");

  Html5Qrcode.getCameras().then(devices => {

    if (!devices || devices.length === 0) {
      alert("Keine Kamera gefunden");
      return;
    }

    cameras = devices;

    // wenn noch keine Kamera gewählt → starte mit erster
    if (currentCameraIndex >= cameras.length) {
      currentCameraIndex = 0;
    }

    const cameraId = cameras[currentCameraIndex].id;

    html5QrCode.start(
      cameraId,
      {
        fps: 10,
        qrbox: 250
      },
      (decodedText) => {
        handleScan(decodedText);
        stopScanner();
      }
    );
  });
}

function switchCamera() {
  if (!cameras.length) {
    alert("Scanner noch nicht gestartet");
    return;
  }

  stopScanner();

  currentCameraIndex = (currentCameraIndex + 1) % cameras.length;

  setTimeout(() => {
    startScanner();
  }, 300);
}

function stopScanner() {
  if (html5QrCode) {
    html5QrCode.stop().then(() => {
      document.getElementById("reader").innerHTML = "";
    }).catch(() => {});
  }
}

function handleScan(code) {
  // Barcode wird hier verarbeitet
  document.getElementById("name").value = code;
}
  
let products = JSON.parse(localStorage.getItem("products")) || [];

function save() {
  localStorage.setItem("products", JSON.stringify(products));
}

function addProduct() {
  const name = document.getElementById("name").value;
  const mhd = document.getElementById("mhd").value;
  const qty = parseInt(document.getElementById("qty").value || "1");

  if (!name || !mhd) return;

  // prüfen ob Produkt schon existiert (gleiches Produkt + MHD)
  let existing = products.find(p => p.name === name && p.mhd === mhd);

  if (existing) {
    existing.qty += qty;
  } else {
    products.push({ name, mhd, qty });
  }

  save();
  render();
}

function removeOne(index) {
  products[index].qty -= 1;

  if (products[index].qty <= 0) {
    products.splice(index, 1);
  }

  save();
  render();
}

function removeProduct(index) {
  products.splice(index, 1);
  save();
  render();
}

function render() {
  const list = document.getElementById("list");
  list.innerHTML = "";

  products.sort((a, b) => {
    return parseDate(a.mhd) - parseDate(b.mhd);
  });

  const today = new Date();

  products.forEach((p, i) => {
    const expiry = parseDate(p.mhd);
    
    const diffDays = (expiry - today) / (1000 * 60 * 60 * 24);

    let status = "";

    if (diffDays < 0) {
      status = "🔴 abgelaufen";
    } else if (diffDays <= 7) {
      status = "⚠️ bald ablaufend";
    } else {
      status = "🟢 ok";
    }

    list.innerHTML += `
      <tr>
        <td>${p.name}</td>
        <td>${p.qty}</td>
        <td>${p.mhd} ${status}</td>
        <td>
          <button onclick="removeOne(${i})">-1</button>
          <button onclick="removeProduct(${i})">Löschen</button>
        </td>
      </tr>
    `;
  });
}

function parseDate(str) {
  const [day, month, year] = str.split(".");
  return new Date(year, month - 1, day);
}

render();
</script>

</body>
</html>
