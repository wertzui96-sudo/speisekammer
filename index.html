<!DOCTYPE html>
<html>
<head>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <meta charset="UTF-8">
  <title>Speisekammer</title>
  <style>
    body { font-family: Arial; margin: 40px; }
    input, button { padding: 8px; margin: 5px; }
    table { margin-top: 20px; width: 100%; border-collapse: collapse; }
    th, td { border: 1px solid #ccc; padding: 10px; text-align: left; }
  </style>
</head>
<body>

<h1>🥫 Meine Speisekammer</h1>

<input id="name" placeholder="Produkt">
<input id="mhd" placeholder="MHD (z.B. 01.01.2026)">
<input id="qty" type="number" placeholder="Menge" value="1" min="1">

<br><br>

<button onclick="startScanner()">📷 Scanner starten</button>
<button onclick="stopScanner()">⛔ Scanner stoppen</button>
<button onclick="switchCamera()">🔄 Kamera wechseln</button>

<div id="reader" style="width:300px; margin-top:10px;"></div>
  
<button onclick="addProduct()">Einlagern</button>

<table>
  <thead>
    <tr>
      <th>Produkt</th>
      <th>MHD</th>
      <th>Aktion</th>
    </tr>
  </thead>
  <tbody id="list"></tbody>
</table>

<script>
let html5QrCode;
let cameras = [];
let currentCameraIndex = 0;

function startScanner() {
  Html5Qrcode.getCameras().then(devices => {

    if (!devices || devices.length === 0) {
      alert("Keine Kamera gefunden");
      return;
    }

    cameras = devices;

    if (!html5QrCode) {
      html5QrCode = new Html5Qrcode("reader");
    }

    const cameraId = cameras[currentCameraIndex].id;

    html5QrCode.start(
      cameraId,
      {
        fps: 10,
        qrbox: { width: 250, height: 250 },

        // 🔥 WICHTIG: Barcode-Formate aktivieren
        formatsToSupport: [
          Html5QrcodeSupportedFormats.EAN_13,
          Html5QrcodeSupportedFormats.EAN_8,
          Html5QrcodeSupportedFormats.UPC_A,
          Html5QrcodeSupportedFormats.UPC_E,
          Html5QrcodeSupportedFormats.CODE_128
        ],

        // 📱 zwingt Rückkamera (iPhone wichtig)
        videoConstraints: {
          facingMode: { exact: "environment" }
        }
      },
      (decodedText) => {
        handleScan(decodedText);
        stopScanner();
      }
    ).catch(err => {
      console.error(err);
      alert("Scanner Fehler: " + err);
    });
  });
}

function switchCamera() {
  if (!cameras.length) return;

  stopScanner();

  currentCameraIndex = (currentCameraIndex + 1) % cameras.length;

  setTimeout(() => {
    startScanner();
  }, 300);
}

function stopScanner() {
  if (html5QrCode) {
    html5QrCode.stop()
      .then(() => {
        document.getElementById("reader").innerHTML = "";
      })
      .catch(() => {});
  }
}
</script>

</body>
</html>
