<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Speisekammer</title>
  <style>
    body { font-family: Arial; margin: 40px; }
    input, button { padding: 8px; margin: 5px; }
    table { margin-top: 20px; width: 100%; border-collapse: collapse; }
    th, td { border: 1px solid #ccc; padding: 10px; text-align: left; }
  </style>
</head>
<body>

<h1>🥫 Meine Speisekammer</h1>

<input id="name" placeholder="Produkt">
<input id="mhd" placeholder="MHD (z.B. 01.01.2026)">
<input id="qty" type="number" placeholder="Menge" value="1" min="1">

<button onclick="addProduct()">Einlagern</button>

<table>
  <thead>
    <tr>
      <th>Produkt</th>
      <th>MHD</th>
      <th>Aktion</th>
    </tr>
  </thead>
  <tbody id="list"></tbody>
</table>

<script>
let products = JSON.parse(localStorage.getItem("products")) || [];

function save() {
  localStorage.setItem("products", JSON.stringify(products));
}

function addProduct() {
  const name = document.getElementById("name").value;
  const mhd = document.getElementById("mhd").value;
  const qty = parseInt(document.getElementById("qty").value || "1");

  if (!name || !mhd) return;

  // prüfen ob Produkt schon existiert (gleiches Produkt + MHD)
  let existing = products.find(p => p.name === name && p.mhd === mhd);

  if (existing) {
    existing.qty += qty;
  } else {
    products.push({ name, mhd, qty });
  }

  save();
  render();
}

function removeOne(index) {
  products[index].qty -= 1;

  if (products[index].qty <= 0) {
    products.splice(index, 1);
  }

  save();
  render();
}

function removeProduct(index) {
  products.splice(index, 1);
  save();
  render();
}

function render() {
  const list = document.getElementById("list");
  list.innerHTML = "";

  products.sort((a, b) => {
    return parseDate(a.mhd) - parseDate(b.mhd);
  });

  const today = new Date();

  products.forEach((p, i) => {
    const expiry = parseDate(p.mhd + "-01");

    const diffDays = (expiry - today) / (1000 * 60 * 60 * 24);

    let status = "";

    if (diffDays < 0) {
      status = "🔴 abgelaufen";
    } else if (diffDays <= 7) {
      status = "⚠️ bald ablaufend";
    } else {
      status = "🟢 ok";
    }

    list.innerHTML += `
      <tr>
        <td>${p.name}</td>
        <td>${p.qty}</td>
        <td>${p.mhd} ${status}</td>
        <td>
          <button onclick="removeOne(${i})">-1</button>
          <button onclick="removeProduct(${i})">Löschen</button>
        </td>
      </tr>
    `;
  });
}

function parseDate(str) {
  const [day, month, year] = str.split(".");
  return new Date(year, month - 1, day);
}

render();
</script>

</body>
</html>
